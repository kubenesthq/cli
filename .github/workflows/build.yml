name: Release

# Tag-triggered release: cross-platform binaries, SHA-256 checksums, a keyless
# cosign signature over the checksums, and SLSA build provenance for every
# binary. This CLI installs software onto production hosts as root — an
# unsigned curl-able binary is not defensible, so every artifact is verifiable
# back to this workflow run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # keyless signing + provenance (OIDC)
      attestations: write  # SLSA provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test before releasing
        run: go vet ./... && go test -race ./...

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          TAG=${GITHUB_REF##*/}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X kubenest.io/cli/pkg/version.Version=${TAG} \
            -X kubenest.io/cli/pkg/version.Commit=${COMMIT} \
            -X kubenest.io/cli/pkg/version.Date=${DATE}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" \
                -o "dist/kubenest-${TAG}-${os}-${arch}${ext}" ./cmd/kubenest
            done
          done

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      # PINNED TO THE VERSION install.sh PINS. The signer and the verifier must
      # be one implementation: cosign v3 REMOVED sign-blob's --output-signature
      # and --output-certificate and verify-blob's --signature/--certificate, so
      # a v2 signer and a v3 verifier cannot agree on an artifact at all. That
      # mismatch is what shipped here — this workflow emitted a detached
      # .sig/.pem pair while install.sh downloaded checksums.txt.sigstore.json
      # and verified it with --bundle, so the installer 404'd on every release
      # this workflow produced. Bump this and COSIGN_VERSION in install.sh
      # together, never one alone.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # ONE ARTIFACT: the Sigstore bundle. It carries the signature, the Fulcio
      # certificate and the Rekor entry in a single file, which is what
      # install.sh's `cosign verify-blob --bundle` reads. There is deliberately
      # no detached .sig/.pem alongside it — cosign v3's sign-blob cannot
      # produce them, and a second format is a second thing to keep in sync.
      #
      # It lands in dist/, so the `files: dist/*` upload below ships it as a
      # release asset. An unuploaded bundle is the same 404 as no bundle.
      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kubenest-*

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          body: |
            ## KubeNest CLI ${{ github.ref_name }}

            Binaries for Linux, macOS and Windows (amd64/arm64) are attached,
            with SHA-256 checksums, a Sigstore signature and SLSA build
            provenance.

            ### Verify what you downloaded

            ```bash
            # 1. Integrity: the binary matches its checksum
            sha256sum -c --ignore-missing checksums.txt

            # 2. Authenticity: the checksums were signed by this repo's release
            #    workflow. Needs cosign v3 (v2's verify-blob cannot read this
            #    bundle format). The identity flags are the whole point: without
            #    them you have only proved that somebody signed it.
            cosign verify-blob checksums.txt \
              --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/build\.yml@refs/tags/v.*$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com

            # 3. Provenance: the binary was built by this workflow from this commit
            gh attestation verify kubenest-${{ github.ref_name }}-linux-amd64 --repo ${{ github.repository }}
            ```

            ### Install

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/kubenest-${{ github.ref_name }}-linux-amd64
            chmod +x kubenest-${{ github.ref_name }}-linux-amd64
            sudo mv kubenest-${{ github.ref_name }}-linux-amd64 /usr/local/bin/kubenest
            kubenest --version
            ```

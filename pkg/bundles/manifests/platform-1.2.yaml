# KubeNest Platform 1.2 — Platform 1.1 with the Kubernetes patch and the agent
# chart moved, plus the declarations a reader of 1.2 needs to be able to check:
#
#   core.k3s             v1.35.7+k3s1 -> v1.35.8+k3s1   (the same minor: F18
#                        grants a temporary exception instead of moving to 1.36;
#                        see the `kubernetes:` block below)
#   core.kubenest-agent  2.6.17 -> 2.7.0-rc.1           (the candidate chart,
#                        from the candidate channel and by digest — see
#                        `sources:` and `digests:` below. It is the chart that
#                        carries 1.2's new health producers, the reboot-hold
#                        labels, HelmChartConfig reconciliation and the node
#                        reporter, so the pin and the producers are one release
#                        rather than a plan.)
#
# Every other pin, limit, timeout and profile is 1.1's, byte for byte.
#
# WHY THE k3s PATCH MOVES AT ALL. `kubenest platform upgrade --to 1.2` must
# really run the Kubernetes stage — the stage whose recovery path is the point of
# no return — rather than stepping past it because the pin did not change (plan
# 7.10, scenario S2). A patch is the smallest move that does that, and the minor
# is not moved in this release.
#
# WHAT THESE BLOCKS ARE, AND WHAT THEY ARE NOT. `upgrade-from`, `security-only`,
# `upgrade-only`, `previews`, `compatibility`, `kubernetes`, `control-plane` and
# `digests` are DECLARATIONS other components read; none of them is enforcement,
# and each names the task that enforces it. `upgrade-from` and the bundle-path
# gate's adjacency rule are two halves of one story: 1.0 is a supported source
# here and 1.0 -> 1.2 is still refused, because it is two bundles ahead and 1.1
# is not security-only.
#
# The rest of this header is 1.0's and still true of the pins it describes —
# the agent pin's long history above all, which is why it is kept whole.
#
#
# Pin rule (see bundle-manifest.schema.json): the version is the version of the
# artifact the installer installs — Helm chart version for chart-installed
# components, upstream release tag otherwise. Every pin below was verified
# against the live upstream release channel on 2026-08-20.
#
# k3s policy (decision B, 2026-08-20): track upstream stable minus one minor,
# pinned to that minor's current patch. Stable was v1.36.3+k3s1 on 2026-08-20,
# so Platform 1.0 pins the v1.35 channel's latest patch.
#
# 1.2 (2026-09-27) moves to the 1.35 channel's newest STABLE release. Verified
# against the k3s release list rather than assumed: v1.35.8+k3s1 was published
# 2026-08-27 and its release asset answers, while v1.35.9 exists only as an RC
# (v1.35.9-rc2, 2026-09-24) — a release candidate is not a patch release and is
# not pinned. Upstream 1.35's end of support is 2027-02-28, which falls inside a
# pilot that starts in November, and that date is recorded in the `kubernetes:`
# block below because a date a reader must re-derive from a release calendar is
# a date nobody checks.
#
# Chart repo facts recorded for the installer libraries (verified 2026-08-20):
#   traefik                  https://traefik.github.io/charts
#   cert-manager             https://charts.jetstack.io
#   openebs-lvm-localpv      https://openebs.github.io/lvm-localpv
#   velero                   https://vmware-tanzu.github.io/helm-charts
#                            (the SOURCE repo moved to velero-io/velero, but the
#                            chart still lives and releases in vmware-tanzu)
#   kured                    https://kubereboot.github.io/charts
#   sealed-secrets           https://bitnami.github.io/sealed-secrets
#                            (moved from bitnami-labs; the old index is a 404)
#   external-secrets         https://charts.external-secrets.io
#   grafana / loki           https://grafana-community.github.io/helm-charts
#                            (moved from grafana/helm-charts in 2026; the old
#                            repo is frozen / enterprise-only for these charts)
#   victoria-metrics-single  https://victoriametrics.github.io/helm-charts
#   openebs (umbrella)       https://openebs.github.io/openebs
#   kubenest-agent           oci://ghcr.io/kubenesthq/candidate/kubenest-operator-2
#                            for 1.2 (the CANDIDATE channel; machine-readable
#                            under sources: below — the backend composes
#                            install-instructions chart_ref from it). The stable
#                            path, oci://ghcr.io/kubenesthq/charts/kubenest-operator-2,
#                            still serves 2.6.17/d8475a8 and is untouched by a
#                            candidate cut. The candidate package was PRIVATE
#                            when this bundle was authored (an anonymous
#                            `helm pull` is refused until an org admin flips its
#                            visibility once), so a lab installs it from the op3
#                            checkout; the digest below is what the bytes are.

bundle: "1.2"

core:
  k3s: v1.35.8+k3s1                    # single-node embedded etcd on every tier (decision A).
                                       # 1.2's move, within 1.35: the newest STABLE 1.35
                                       # patch (published 2026-08-27; v1.35.9 is an RC only).
                                       # It exists so the upgrade runs the Kubernetes stage for
                                       # real. `kubernetes:` below records the minor's upstream
                                       # end of support and the F18 exception that keeps the
                                       # minor where it is.
  traefik: 41.4.0                      # chart; ships Traefik v3.7.12, Gateway API provider.
                                       # SECURITY FLOOR (kn-b49n). v3.7.12 is the lowest version
                                       # with no open Traefik advisory. 41.2.0 shipped v3.7.10,
                                       # against which SEVEN were open, verified 2026-09-06 via
                                       # the traefik/traefik repository advisory list:
                                       #   GHSA-5w68-77r2-r64c  CRITICAL  digestAuth authenticates
                                       #     any username with no password        (<= 3.7.10 -> 3.7.11)
                                       #   GHSA-g55h-rg46-x9c5  high  TLSOption confusion in
                                       #     multi-host routers bypasses mTLS      (<= 3.7.10 -> 3.7.11)
                                       #   GHSA-rf44-j88r-hh8c  med   ForwardAuth identity spoofing
                                       #     via dot-form header alias             (<= 3.7.11 -> 3.7.12)
                                       #   GHSA-m6wx-622r-48r9  high  Ingress service middleware
                                       #     bypasses crossProviderNamespaces      (<= 3.7.10 -> 3.7.11)
                                       #   GHSA-j994-9gqj-9hwq  high  same-host Ingress TLS option
                                       #     conflict disables client-cert auth    (<= 3.7.10 -> 3.7.11)
                                       #   GHSA-cjr6-pf59-jq29  high  ingress-nginx from-to-www
                                       #     sibling router serves auth'd backend  (<= 3.7.11 -> 3.7.12)
                                       #   GHSA-7ghq-v6jf-g56c  med   respondingTimeouts.readTimeout
                                       #     not applied to HTTP/3                 (<= 3.7.11 -> 3.7.12)
                                       # The first three are reachable on a platform cluster: the
                                       # chart installs middlewares.traefik.io and runs with
                                       # --providers.kubernetescrd, so any project namespace can
                                       # create the Middleware or TLSOption that triggers them.
                                       # The last four need the Ingress or ingress-nginx provider
                                       # or an HTTP/3 entrypoint, none of which the platform
                                       # enables — they are fixed here, not exploitable before.
                                       # Not affected at 41.2.0: GHSA-fgjj-px3w-67xx (Gateway API
                                       # route-identity collision) — patched in v3.7.10, so the
                                       # previous pin already carried it.
                                       # 41.2.0 -> 41.4.0 renders byte-identically under this
                                       # platform's values apart from the image tag.
                                       # Floor asserted by test_traefik_pin_is_at_or_above_the_security_floor.
  gateway-api: v1.6.1                  # standard-channel CRD bundle of this release
  cert-manager: v1.21.1                # chart == app version
  openebs-lvm-localpv: 1.10.0          # chart == app version
  velero: 12.1.0                       # chart; ships Velero 1.18.1
  system-upgrade-controller: v0.20.1   # release manifests, not a chart
  kured: 6.1.0                         # chart; ships kured 1.23.0
  kubenest-agent: 2.7.0-rc.1           # kubenest-operator-2 chart (the agent IS the operator, decision G).
                                       # 1.2's pin, and the FIRST candidate pin in the catalog.
                                       # The chart is cut from op3 ab4c3f7 (its appVersion) and
                                       # published to the CANDIDATE channel — a separate OCI
                                       # repository, oci://ghcr.io/kubenesthq/candidate/
                                       # kubenest-operator-2 — never to the stable path, so a
                                       # `>=`-style range against the stable reference cannot
                                       # resolve to a release candidate. Its chart archive digest
                                       # is recorded under `digests:` below; the version alone
                                       # does not name the bytes, and published chart versions are
                                       # immutable.
                                       #
                                       # WHAT 1.2 NEEDS FROM IT. The chart carries the release's
                                       # whole operator half: the new health producers (datastore,
                                       # os_patching, bundle drift, upgrade state, cert-manager
                                       # Certificates), the kured reboot-hold labels and
                                       # HelmChartConfig reconciliation, the node reporter
                                       # DaemonSet's companion wiring, the reconcile pause and
                                       # recovery mode, and narrower k3s-API permissions. A bundle
                                       # that pins an older chart installs green and then reports
                                       # health groups whose producer is absent, which is the
                                       # 2.6.10 shape the hub refuses.
                                       #
                                       # THE CANDIDATE PACKAGE WAS PRIVATE WHEN THIS WAS AUTHORED.
                                       # An anonymous `helm pull` from the candidate repository is
                                       # refused until an org admin makes the package public once
                                       # (the publish workflow's visibility step warned it could not).
                                       # A lab therefore installs the chart from the op3 checkout;
                                       # promotion (T7.5) is what puts an equivalent chart back on
                                       # the stable path, and nothing here advertises the candidate
                                       # to a candidate-free catalog.
                                       #
                                       # The history below is 1.1's pin comment, unchanged. It
                                       # describes 2.6.17 and the charts before it; read it as the
                                       # record of what each of those moved and why, not as the
                                       # current pin.
                                       #
                                       # 2.6.17 pins image d8475a8, and it moves for ONE reason: 2b26e23, which 2.6.16
                                       # pins, rewrote every workload Application it owns on every reconcile. The
                                       # Application CRD has no status subresource, so each write erased the status
                                       # Argo CD had written, the operator's own Application watch saw that, and the
                                       # next reconcile wrote again: generation 21087 about 18 minutes after creation,
                                       # measured on two real clusters on 2026-09-24. Under kn-cjqw Option A every
                                       # workload Application is operator-owned, so every 1.0 cluster does this.
                                       #
                                       # WHAT A CLUSTER RECEIVES BY MOVING 2.6.16 -> 2.6.17: image.tag 2b26e23 ->
                                       # d8475a8, and nothing else functional. The only template change between the
                                       # two is a comment in rbac.yaml (op3 4d4b46d). Everything the operator gained
                                       # between 2b26e23 and d8475a8 is listed in the chart's own Chart.yaml.
                                       #
                                       # The history below is 1.0's pin comment, unchanged.
                                       #
                                       # 2.6.16 pins image 2b26e23, and it moves for ONE reason: 36551fd,
                                       # where the operator STOPS ADVERTISING kubenest_sa_token once it owns
                                       # its workload Applications. Until this pin moved, that fix existed as
                                       # a published image that no install could take.
                                       #
                                       # WHAT A STANDALONE INSTALL ACTUALLY RECEIVES BY MOVING 2.6.14 ->
                                       # 2.6.16. Read by extracting BOTH published archives and diffing them,
                                       # not from the branch. Ignoring comments, README and the Chart.lock
                                       # timestamp, the whole functional delta is three things:
                                       #
                                       #   image.tag             3c1e510 -> 2b26e23   the operator binary
                                       #   image.digest          (new, empty) + deployment.yaml renders
                                       #                         through the kubenest-operator.image helper
                                       #                         instead of repository:tag  (eb245af)
                                       #   workloadApplications.enabled   false -> null
                                       #
                                       # THE THIRD LINE IS THE BEHAVIOUR CHANGE AND IT IS NOT THE BEARER FIX.
                                       # 2.6.14 shipped the migration gate as an explicit false, so a
                                       # standalone install kept the legacy host-ArgoCD owner. 2.6.16 ships it
                                       # UNSET, which hands the decision to the operator's one-time probe: a
                                       # FRESH cluster opens the gate and owns its workload Applications
                                       # locally. That is kn-k9ko (93f612e), not kn-bz3k, and anyone reading
                                       # this pin as "the bearer fix" alone will be surprised by it.
                                       #
                                       # The upgrade direction is guarded and the guard is in the operator,
                                       # not here: the resolved gate is recorded in the ConfigMap
                                       # kubenest-workload-applications-gate, and an unset chart value READS
                                       # THAT RECORD rather than re-probing. So an existing cluster whose host
                                       # Applications have not been detached cannot be flipped open by this
                                       # pin. Verified in source (workload_gate.go ResolveWorkloadApplications-
                                       # Gate), not on an upgrade run.
                                       #
                                       # The binary also gains 8c555d8 (kn-k9ko: the operator REFUSES to
                                       # overwrite a workload Application it does not own, instead of adopting
                                       # a name collision into an overwrite with prune and selfHeal) and
                                       # 2b26e23 (kn-pvxx: the StackDeploy CRD kind maps to the hub's "stack"
                                       # resource vocabulary, so operator status reaches the backend mirror).
                                       #
                                       # PROVEN BEFORE THE CHART WAS CUT, because published chart versions are
                                       # immutable: on a real k3d cluster running image digest
                                       # sha256:d07e4f0f23f327659a4af70ab74c054e3bcaf5c49a6f52c4b90981cea49bc80f
                                       # (the pod's own imageID, checked against the registry), heartbeats read
                                       # at the receiving socket rather than from the operator's log — gate
                                       # unset on a fresh cluster gave workload_applications_owner=operator
                                       # with NO kubenest_sa_token, and an explicit
                                       # kubenest.workloadApplications.enabled=false gave the bearer and no
                                       # ownership field. Both directions, so the omission is known to refuse
                                       # as well as to fire. The published 2.6.16 archive was then installed on
                                       # a clean cluster and reproduced the first result.
                                       #
                                       # THIS PIN STILL CARRIES ONLY THE OPERATOR HALF of the credential
                                       # sentence. The control plane must ALSO stop holding the bearer it was
                                       # already given: backend b370dda clears the stored row on the ownership
                                       # handover and a66c441 makes that clear fire on the ownership STATE
                                       # rather than only on the transition. Neither is pinnable from here.
                                       # Until a control plane carries both, an operator-owned cluster stops
                                       # SENDING a credential the control plane may still be HOLDING.
                                       #
                                       # 2.6.14 pinned image 3c1e510. It establishes the configured GitOps
                                       # branch before the initial commit in a pre-existing empty repository,
                                       # verifies the remote ref after a push, and rejects a no-write signal
                                       # that previously looked like success. A real empty Gitea bootstrap
                                       # created main, then reached a Synced/Healthy Application and Ready Pod
                                       # without a hand-created repository commit. 3c1e510 is a descendant of
                                       # 45eb0e7, so it also retains 2.6.13's safety boundary for
                                       # 2.6.12's P0 cache repair; do not attach the old chart-only rationale
                                       # to this release. 2.6.12 made ArgoCD's namespaced cache work by
                                       # granting every API type within a namespace. ArgoCD enumerates every
                                       # type present there, not just KubeNest types, so an API-group list
                                       # was unclosable: Traefik is in platform-1.0 and a customer's chart
                                       # can introduce the next unknown CRD.
                                       # 2.6.12's explanation incorrectly said that broad RoleBinding reached
                                       # only namespaces KubeNest created. ProjectReconciler could instead
                                       # adopt an arbitrary existing namespace matching a Project name, then
                                       # mutate it and bind the bearer. 45eb0e7 refuses that path before a
                                       # mutation or RoleBinding unless the Project carries backend identity
                                       # and the namespace carries matching KubeNest project and operator
                                       # identity. Thus kube-system or another foreign namespace cannot gain
                                       # the broad namespace-local grant by name reuse. The cluster-scoped
                                       # discovery read stays at namespaces, customresourcedefinitions and
                                       # apiservices; it is not broadened.
                                       # Pin what was proved: the exact 45eb0e7 source passed real envtest
                                       # against an API server: a foreign existing namespace was refused with
                                       # no ownership mutation and no RoleBinding; a matching namespace gained
                                       # the expected RoleBinding. This is a refusal claim, so that terminal
                                       # artifact is the appropriate proof, not a workload pod assertion.
                                       # The 2.6.12 functional evidence remains separate: on a real cluster
                                       # ArgoCD Synced/Healthy and a workload pod reached 1/1 Running while
                                       # listing Traefik and resource.k8s.io types.
                                       # THIS PIN CARRIES ONLY THE CHART/OPERATOR HALF. TWO SEPARATE P0s
                                       # were repaired half here and half in a control plane this pin cannot
                                       # gate, so state both rather than letting a reader assume the pin is
                                       # the whole repair:
                                       #
                                       #   WHAT YOU GET FROM THIS PIN  the 2.6.12 namespaced-cache grant,
                                       #     2.6.13's namespace-ownership boundary, and 2.6.14's GitOps
                                       #     bootstrap repair. Operator-side only.
                                       #
                                       #   WHAT NEEDS A CONTROL PLANE TOO, and how to check it. Both halves
                                       #     are in the backend and neither is pinnable from here:
                                       #       contract >= 1  the ArgoCD Secret's scope keys are written at
                                       #                      the TOP LEVEL, where ArgoCD reads them, rather
                                       #                      than inside the config blob where they were
                                       #                      silently ignored (2mmz, backend 024bff6).
                                       #       contract >= 2  a cluster is NEVER registered unrestricted. The
                                       #                      scope keys were omitted entirely for a cluster
                                       #                      with no projects yet -- which is every cluster
                                       #                      at first registration -- and ArgoCD reads an
                                       #                      absent `namespaces` key as EVERY namespace, so
                                       #                      the cache enumerated the whole cluster and one
                                       #                      denial failed it (kn-k9ko, backend 79d77b5).
                                       #
                                       #     CHECK IT, do not take it on trust, and do not compare SHAs --
                                       #     two SHAs cannot be ordered without the repository, which no
                                       #     operator has:
                                       #       curl -fsS -H "Authorization: Bearer $TOKEN" \
                                       #         "$API/api/v1/version" | jq -r .contract
                                       #     A 404 there means the control plane predates the endpoint, so
                                       #     the check is UNAVAILABLE -- not that the fix is absent.
                                       #     (kn-control-plane-version-identity-frev.)
                                       # Everything 2.6.11 carried rides along: the stack-intent ownership
                                       # fixes, the capability advertisement that keeps a current hub
                                       # routing to this agent, the StackDeploy lifecycle handlers, kn-
                                       # bibk's reachability condition, fail-closed addon configuration and
                                       # the hub-routed Component Secret handler. Do not pin below 2.6.10
                                       # (the hub refuses an agent that does not advertise), 2.6.10 or
                                       # 2.6.11 (ownership holes, then cache failure), or 2.6.12 (the cache
                                       # works but the namespace-identity guard was not yet present).
                                       # WHICH INSTALL MODE THIS REACHES: standalone OCI-chart installs
                                       # consuming platform-1.0. Provisioned clusters receive it NOT AT ALL —
                                       # but no longer for the reason this line used to give. The provisioner
                                       # does not read this pin: it carries its OWN constants, and the
                                       # published image ghcr.io/kubenesthq/provisioner:latest (revision
                                       # 56fad137185678dc7d4b71e1143cfc615eeaf464) sets
                                       # OPERATOR_CHART_VERSION="2.6.15" with an immutable
                                       # OPERATOR_IMAGE_DIGEST. The old "still installs chart 2.1.0"
                                       # (kn-5mba) was repaired by kn-provisioner-untraceable-pin-m1b2. So
                                       # moving THIS line changes nothing for provisioned clusters in either
                                       # direction, and the two populations now drift apart on purpose:
                                       # standalone at 2.6.16, provisioned at 2.6.15.
                                       # 2.6.1 through 2.6.4 are immutable rejected recovery experiments;
                                       # never republish or repin them.
                                       # 2.5.0 (kn-sf17) is the first chart that can express a cluster with
                                       # NO hub. Below it, kubenest.unmanaged is accepted and silently
                                       # discarded — no chart in this line ships a values.schema.json — so a
                                       # standalone install would deploy an agent still expecting a hub.
                                       # The CLI refuses rather than allowing that (minChartForUnmanaged),
                                       # so this pin is what makes `kubenest platform install` work with no
                                       # control plane at all. appVersion moves with it to 7b84b83, the
                                       # operator build that reads the mode; 2.4.1's binary does not know it.
                                       # A managed render is unchanged from 2.4.1 apart from two comments.
                                       #
                                       # 2.4.1, not 2.4.0 (kn-go83). Both carry the same templates and the
                                       # same appVersion; 2.4.1 is docs-only over 2.4.0 and was verified so
                                       # by rendering both published charts with identical values and
                                       # diffing 41,371 lines of output to nothing. What it fixes is the
                                       # chart's OWN README values table, which in 2.4.0 still names
                                       # wss://api.kubenest.io/v2/operator/events as the default for
                                       # kubenest.backendURL - the live host serving another customer that
                                       # 2.4.0's templates had just removed (kn-vv3f). Pinning 2.4.0 here
                                       # would ship a bundle whose `helm show readme` hands the operator
                                       # exactly the host the bundle exists to keep them away from.
                                       # This pin said 2.4.0 only because 2.4.1 did not exist yet: contracts
                                       # moved to 2.4.0 at 2026-08-31 00:46 UTC and 2.4.1 was published at
                                       # ~06:59 UTC the same day.
                                       #
                                       # 2.4.0 was the first chart whose appVersion can actually READ the
                                       # per-cluster GitOps deploy key. 2.3.5 carried gitSSHPrivateKey and
                                       # mounted it, but pinned appVersion dcc8d25 - a build from before
                                       # kn-gjew (19a611e) taught the operator to read
                                       # GIT_SSH_PRIVATE_KEY_FILE. That binary reads GIT_TOKEN only, which
                                       # the CLI deliberately leaves empty, so it logged "Warning: GIT_TOKEN
                                       # not set - only public repositories will be accessible" and carried
                                       # on against a private repo. GitOps did not work on this bundle and
                                       # nothing said so. Verified by pulling chart 2.3.5 from ghcr and
                                       # reading dcc8d25's cmd/manager/main.go, not inferred.
                                       #
                                       # 2.4.0 also makes kubenest.backendURL REQUIRED (kn-vv3f): the chart
                                       # refuses to render without it rather than defaulting to a live host
                                       # serving another customer. Safe here - agent.Values always sets it
                                       # from the mint, and refuses an empty hub URL before that.
                                       #
                                       # 2.3.5 proved PVC bytes and named unreadable backup archives.
                                       # 2.2.0 made Helm-only installs self-provision identity and dropped ingress-nginx.
                                       # 2.1.0's default image tag was published nowhere - do not pin back.
                                       #
                                       # Note the 2.3.5 on ghcr is NOT the 2.3.5 a273b3d cut: 19a611e and
                                       # 8411f91 both changed chart contents without bumping the version.
                                       # Every content change from 2.4.0 on bumps it - a convention, with
                                       # nothing enforcing it until kn-bife lands: the chart workflow
                                       # republishes whatever version Chart.yaml names, over whatever is
                                       # already there.

# Version-less base refs; the version is ALWAYS the core pin above (one pin, one
# place). kubenest-agent's is load-bearing: the backend renders install-instructions
# chart_ref as <source>:<pin>, and the previous hardcoded registry.kubenest.io did
# not exist (kn-z6e4). Anonymous `helm pull` of this ref verified 2026-08-20.
sources:
  # 1.2's agent source is the CANDIDATE channel, and it is deliberately a
  # DIFFERENT OCI repository from the stable one: a chart in OCI has no floating
  # "channel", so the channel is the reference, and the stable catalog and the
  # default installer never name the candidate. The backend composes
  # install-instructions chart_ref as <source>:<core.kubenest-agent>, so the
  # ref a cluster receives travels with the bundle rather than from a constant.
  kubenest-agent: oci://ghcr.io/kubenesthq/candidate/kubenest-operator-2

# WHAT THE BUNDLE WAS CUT FROM, BY DIGEST. A version names a release; a digest
# names bytes. The candidate chart's archive digest, read back from the publish
# run (op3 chart workflow, 2026-09-27), is the only record of which bytes
# 2.7.0-rc.1 is in this catalog.
digests:
  kubenest-agent: sha256:08b6746116c62c75880ccb2f5179182a0f1f69cf293ab5dcdda9efcd80c914f4

# THE KUBERNETES MINOR, AND WHY IT IS NOT MOVING. Decision B (2026-08-20) says
# track upstream stable minus one minor. Upstream stable is 1.37 (released
# 2026-08-26), which makes stable-minus-one 1.36 — but 1.2 does not move the
# major-version-graded Kubernetes minor: that is a larger, separately tested
# scope, S2 must still exercise the patch path, and M7 owns the minor upgrade
# as its own transition with a date. F18 grants the temporary exception, and it
# is recorded here rather than left to be re-derived, because a reader who
# computes stable-minus-one from the release calendar will otherwise read this
# pin as a mistake.
#
# support-ends is upstream's own end of support for 1.35: 2027-02-28, which
# falls inside a pilot that starts in November. That is the deadline M7's minor
# upgrade has to beat, and it is why the exception is temporary rather than
# open-ended.
kubernetes:
  minor: "1.35"
  support-ends: "2027-02-28"
  stable-minus-one-exception: "F18"

# THE CONTROL PLANE'S OWN PIN. 1.2 records the PostgreSQL major and the exact
# image the control-plane chart runs (kubenest-helm/kubenest/values.yaml,
# postgresql.image). The chart pins only the digest of bitnami/postgresql:latest
# and no major version was recorded anywhere, so the upgrade gate that refuses a
# change of major or distribution had nothing to compare beyond the chart it was
# handed. The major is an integer because the comparison is same-major-or-not
# and ":latest" does not name one.
#
# The image's own major is 18, not inferred from the tag: kubenest-backend's
# Dockerfile ships postgresql-client-18, which is what takes the dump, and a
# client older than its server refuses to dump it — the two must move together.
control-plane:
  postgres:
    major: 18
    image: bitnami/postgresql:latest@sha256:7d77a46bbf200709237318c27dec0eaeae2520e403dd18fdebde2be7a6b04993

# THE COMPATIBILITY WINDOW (decision L, kn-opj8), DECLARED.
#
# The window is expressed in bundle versions, which are orderable. The control
# plane has no bundle-era identity of its own — a git sha cannot be ordered
# without the repository — so "which window do I implement" is a release
# artifact and this block is it. It is deliberately NOT tied to a build identity
# and it does not couple control-plane releases to bundle releases: the era
# axis is the control plane's own monotonic counter (CONTROL_PLANE_CONTRACT,
# served by GET /api/v1/version) and it moves when the control plane moves.
#
# control-plane: the contract eras that support THIS bundle. 1.2 needs era 3:
# era 3 is where the control plane stops keeping a tenant credential once the
# operator owns the cluster's workload Applications, which is the half of the
# credential sentence the 1.2 operator pin cannot carry by itself. No maximum:
# a later era is not presumed incompatible, and an absent maximum is "no bound",
# never zero.
#
# agents: for each era, the bundle versions whose agents that control plane
# accepts — the other half of the same window (the current bundle and the one
# before it). Both rows are declared here because platform-1.1.yaml and
# platform-1.0.yaml are released documents and stay byte-unchanged, so the
# catalog's newest release is where the window it is the newest member of gets
# written down. A reader must take the row for the era it is running, never
# assume the newest row applies.
compatibility:
  control-plane:
    min-contract: 3
  agents:
    "2":
      accepts: ["1.0", "1.1"]
    "3":
      accepts: ["1.1", "1.2"]

# DECLARED UPGRADE EDGES (plan 7.10). The bundles a cluster may be upgraded TO
# 1.2 FROM. This is the set of supported SOURCES, and it is not a licence to
# skip a release: 1.0 -> 1.2 is refused by the bundle-path gate's adjacency rule
# (decision K, kn-mtpf) because 1.1, not being security-only, is a bundle you
# must step through — and the refusal names it. A version absent from this list
# has no edge at all and is refused with that reason instead. Every bundle named
# here stays retrievable; dropping a source from a released path is a
# release-level decision, not a catalog tidy-up.
upgrade-from: ["1.0", "1.1"]

# NOT A SECURITY-ONLY RELEASE (kn-mtpf). 1.2 moves the Kubernetes patch, the
# agent chart and the catalog's own declarations, so it consumes the support
# window: once 1.3 ships, 1.1 falls out of it. A release that existed only to
# carry a patched component would be marked true here, and the adjacency gate
# would skip it when it measures how far ahead a target bundle is.
security-only: false

# INSTALLABLE. F19 makes pilots start on 1.2 once 1.2 is released, at which
# point platform-1.1.yaml is marked `upgrade-only: true` and new 1.1 installs are
# refused by the CLI's pre-flight and the backend's bundle-record write. The
# field is authored on the bundle being refused, so flipping it means editing
# that bundle's manifest when it ships — which is why 1.1 carries no such key
# here and this release states its own side of the fact.
upgrade-only: false

# PREVIEWS (F15). `ha` is offered, and it is outside the support tier until the
# promotion gate (S8) passes: the installer accepts `--ha ha` and warns, the
# docs say so, and the tier leaves this list in the release that promotes it.
# `ha` stays in `ha-tiers` below — a preview tier is still offered.
previews: [ha]

os:
  # Only releases actually exercised by the compatibility tests belong here.
  # Ubuntu 26.04 LTS exists; it enters this list when kn-twe tests it.
  supported: [ubuntu-24.04]

ha-tiers: [single-server, ha]

limits:
  # Provisional per decision C (2026-08-20): the structure is settled, the
  # numbers are bundle.mdx's pre-measurement values. kn-ze1 replaces them with
  # measurements and the flag comes off in that bundle release.
  provisional: true
  resources:
    # Binary units throughout: 1 GiB = 1024^3 bytes, which is what
    # /proc/meminfo and statfs report. 3.7Gi is a "4 GB" machine as the kernel
    # actually sees it; a floor written 4Gi would refuse correctly-sized hosts.
    floor: { cpu: 2, memory: 3.7Gi, disk: 36Gi }
    recommended: { cpu: 4, memory: 7.4Gi, disk: 92Gi }
    upgrade-headroom: { disk: 10Gi }
  timeouts:
    node-ready: 5m
    component-ready: 10m
    node-drain: 15m
    node-reboot: 20m
    install-total: 30m
    upgrade-per-node: 30m
    backup: 1h
    restore-drill: 2h

health:
  # kn-j5s. Provisional per decision C's rule: the structure is settled, the
  # numbers are judgement until the fleet is real enough to tune them. They
  # live here rather than in backend code so a release can retune them without
  # a deploy, and so a missing one is a validation error rather than a default
  # someone has to go read the source to discover.
  #
  # 1.2 ADDS THE GROUPS THE NEW PRODUCERS REPORT. The backend refuses to
  # evaluate without thresholds (ThresholdError, never a default), so a key the
  # producers send and this block lacks is an evaluation error at 3am rather
  # than a missing number. Each group is OPTIONAL as a whole — a 1.1 manifest
  # does not declare it and its checks read `unsupported` — and COMPLETE when
  # present. The schema requires the 1.2 groups from 1.2 onward, and only from
  # 1.2 onward, so the released documents stay byte-unchanged.
  #
  # Where the plan names a number it is the plan's (7 and 14 days for
  # os_patching, 25m for a planned reboot, 26h for the recovery point); where it
  # names a check without a number (bundle drift's evidence age, upgrade state's
  # stage age, the datastore warning percent) the value here is the author's,
  # and it is provisional like the rest.
  provisional: true
  certificates:
    # 30 days is enough notice to schedule renewal into a maintenance window
    # rather than page someone; 7 is the point where it stops being planning.
    warning-days: 30
    critical-days: 7
  reporting:
    # Three, not one: a single missed report is a dropped packet or a restart,
    # and an alerting system that cries wolf on those gets muted, which is the
    # same end state as having no alerting.
    missed-reports-before-alert: 3
    clock-skew-tolerance: 5m
  nodes:
    # THE SPLIT GRACE (T2.7/T3.6, plan 7.4). Before 1.2 one 25m window covered
    # both a planned reboot and a node that is simply gone, so a dead node was
    # reported late — the failure the split exists to stop. not-ready-grace is
    # now the short window for everything the platform did NOT plan, and a
    # planned reboot gets its own, longer one below. Both are needed: 1.2's
    # producers report not_ready_since AND whether the reboot was planned, and
    # the backend applies whichever rule the fact matches.
    not-ready-grace: 5m
    # Only for a reboot the operator knows about — kured's reboot-in-progress
    # annotation or a running `kubenest node reboot` — and only for one that
    # started less than this long ago, so a stale annotation grants nothing and
    # an overrun raises its own alert. 25m is 1.1's single grace, kept as the
    # planned window: node-reboot in limits.timeouts is 20m, so this absorbs a
    # reboot that runs slightly long without hiding one that never returns.
    planned-reboot-grace: 25m
  backup:
    # Decision E: workload backup daily, restore drill weekly. These are the
    # ages at which their ABSENCE alerts, so each is its interval plus one
    # cycle of slack — a single failed run is not yet a support incident.
    max-backup-age: 48h
    # THE RECOVERY POINT (T2.10, plan 7.5). Judged on a complete, coordinated
    # restore point rather than on a backup object that merely exists, because
    # an interrupted backup is not something anyone can restore from. 26h is
    # the documented recovery-point policy: the 24h daily schedule plus two
    # hours, so a single run that finished late is not yet a breach.
    recovery-point-age: 26h
    max-restore-drill-age: 336h   # 14d; the shared duration type is s|m|h
    unconfigured-target-grace: 168h  # 7d
  datastore:
    # Decision E sets hourly datastore snapshots; alert at three missed.
    max-snapshot-age: 3h
    # THE etcd BACKEND QUOTA (T2.1). A long-lived single-server cluster can fill
    # it, and the API then refuses writes — so the size is reported AGAINST this
    # number rather than watched raw. The value is the vendored etcd's own
    # default, 2 GiB (2 * 1024^3 = 2147483648 bytes), read from the pinned
    # release rather than guessed: etcd's --quota-backend-bytes default is
    # 2147483648, and k3s does not override it — k3s has no
    # --etcd-quota-backend-bytes flag at all, only --etcd-arg passthrough, and
    # the install passes none. A future release that raises etcd's default, or
    # k3s gains a flag for it, moves this number with the pin.
    quota-bytes: 2147483648
    # 80% is the warning line: etcd alarms only at the quota itself, which is
    # the moment writes start failing, so the warning has to come first and with
    # enough room to act. The plan names the check without a number.
    db-warning-percent: 80
  # OS PATCHING (T3.3/T3.6, plan 7.4). It decides on the reboot marker and the
  # unattended-upgrades timer, not on a package count: a node whose updates
  # timer silently stopped looks healthy on every other signal. Seven days is
  # enough to reach a maintenance window; fourteen is the point at which a
  # security fix that installed but waits for a reboot has clearly not been
  # applied.
  os_patching:
    pending-reboot-warning-days: 7
    pending-reboot-critical-days: 14
  # BUNDLE DRIFT (T2.2). The pins live in the cluster's record, not here; all
  # this decides is how stale the drift CHECK's evidence may be before the group
  # reads unknown instead of healthy. One hour is a reconcile interval's slack
  # — a reconcile that stopped hours ago must not leave a cluster looking like
  # it matches its bundle. The plan names the check without a number.
  bundle:
    max-evidence-age: 1h
  # UPGRADE STATE (T7.0). A cluster that has never been upgraded is healthy and
  # reads "no upgrade performed"; this decides only how long one stage may go
  # unreported before the upgrade is called interrupted rather than in progress
  # — the state an upgrade whose laptop disappeared must show, with its resume
  # command. One hour is longer than every stage's own convergence budget, so a
  # stage that is merely slow is not called interrupted.
  upgrade:
    max-stage-age: 1h

upgrade:
  # Decision D (2026-08-20): adopt pluto, pin its deprecation dataset so the
  # scan cannot silently go stale. The dataset is the data embedded in the
  # pinned pluto release.
  deprecation-scanner:
    tool: pluto
    version: v5.24.3
    dataset: v5.24.3

backup:
  # The object-store plugin rides inside the velero deployment as an init
  # container and serves every S3-compatible target, not only AWS. Its
  # major.minor pairs with the Velero APP version (1.18.x <-> plugin v1.14.x,
  # upstream compatibility matrix) — check this pin whenever core.velero moves.
  # Image verified on Docker Hub (velero/velero-plugin-for-aws) 2026-08-20.
  # Source repo moved to velero-io/velero-plugin-for-aws; the image org did not.
  object-store-plugin:
    provider: aws
    version: v1.14.2
  # Decision E (2026-08-20). On single-server, the gap between datastore
  # snapshots is exactly how much cluster state a disk failure costs.
  defaults:
    datastore-snapshot: { interval: 1h, keep: 24 }
    workload-backup: { interval: 24h, keep: 14 }
    restore-drill: { interval: 7d }

profiles:
  # ONE COMPONENT SET PER SLOT (decision M, 2026-08-23). A profile name resolves
  # to exactly one set of pins, or the compatibility matrix cannot enumerate what
  # "the secrets profile" means and kn-twe's six configurations are not six.
  #
  # Profile pins are chosen and verified against upstream, but no profile has
  # been tested against core as a unit yet — that is wave-4 work (kn-sev5,
  # kn-ynaq) gated by kn-twe's matrix. Hence provisional: true on both component
  # profiles until the matrix runs.
  observability:
    provisional: true
    components:
      victoria-metrics-single: 0.45.0   # chart; ships VictoriaMetrics v1.150.0
      grafana: 12.11.1                  # grafana-community chart; ships Grafana 13.2.0
      loki: 18.10.1                     # grafana-community chart; ships Loki 3.7.6
  secrets:
    # sealed-secrets, and only sealed-secrets. external-secrets was the second
    # component in this slot until decision M; it returns as its own profile,
    # `secrets-external`, when a client with an existing Vault or cloud secret
    # manager needs it — not before. Pinning a component nobody has run is what
    # makes "tested together as one thing" untrue.
    provisional: true
    components:
      sealed-secrets: 2.19.3            # chart; ships controller 0.39.1
  ha:
    # Topology change, not components: two more servers join the embedded-etcd
    # cluster that single-server already runs (decision A).
    components: {}

# NOT IN 1.x: replicated-storage (decision N, 2026-08-23). The engine choice —
# OpenEBS Replicated PV Mayastor via the openebs umbrella chart, 4.5.1, was the
# provisional pin — is deferred until a client needs replicated volumes. It was
# the lowest-priority profile (kn-54ni, P3), no engine had been tested against
# core, and carrying a provisional pin for software nobody has run is the thing
# that makes the bundle's central claim false. Local PV LVM in core plus
# restore-tested backups is the storage story until it returns.
